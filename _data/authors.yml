naila:
  name : "Naila Alavi"
  bio: "Naila Alavi is a PhD scholar, interested in questions of education and the politics of feeling. Her work thinks particularly with Muslim childhoods and questions of emotional governance: how institutions, curricula, and pedagogical practices shape what children are taught to feel, how they are allowed to express those feelings, and what kinds of subjects they are expected to become. She is interested in classrooms not simply as sites of learning, but as spaces where childhood, citizenship, emotion, and power meet. Much of what she is trying to understand begins somewhere within these intersections."
  avatar: "https://i.ibb.co/xK8XVXTn/logoo.png"
  avatar1: "https://static.wixstatic.com/media/d38674_41cb3ea783a847fbbdb2b734f5c2096f~mv2.jpg/v1/fill/w_499,h_447,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/LBF_Fellow2021_AaliyaN%20-%20Aaliya%20N.jpg"
